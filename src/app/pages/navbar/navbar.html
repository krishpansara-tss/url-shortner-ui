<nav class="navbar">
  <div class="logo">
    <a routerLink="/" class="logo-link">ShortURL</a>
  </div>

  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>

    @if (isLoggedIn()) {
      <a routerLink="/users/urls" routerLinkActive="active">My URLs</a>
      @if (isAdmin()) {
        <a routerLink="/admin/manage-urls" routerLinkActive="active" class="admin-link">Admin Panel</a>
      }
      <button (click)="logout()" class="btn-logout">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" class="signup">Sign Up</a>
    }
  </div>
</nav>

<app-navbar></app-navbar>

<div class="auth-container">
  <div class="card auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Start shortening and tracking your links in seconds.</p>

    @if (errorMessage) {
      <div class="alert alert-error">
        {{ errorMessage }}
      </div>
    }

    <form #regForm="ngForm" (ngSubmit)="register(regForm)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="registerRequestObj.name"
          placeholder="e.g. John Doe"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="registerRequestObj.email"
          placeholder="e.g. john@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="registerRequestObj.password"
          placeholder="Minimum 6 characters"
          required
        />
      </div>

      <button type="submit" [disabled]="regForm.invalid || isLoading" class="btn-primary full-width">
        {{ isLoading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>

<div class="auth-page">

    <div class="auth-card">

        <h2>Create account</h2>
        <p>Create an account to manage your URLs.</p>

        <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="Enter your name" [(ngModel)]="registerRequestObj.name" />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" [(ngModel)]="registerRequestObj.email"/>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" [(ngModel)]="registerRequestObj.password"/>
        </div>

        <button class="btn-primary register-button" (click)="register()">
            Register
        </button>

        <p class="auth-footer">
            Already have an account?
            <a routerLink="/login">Login</a>
        </p>

    </div>

</div>

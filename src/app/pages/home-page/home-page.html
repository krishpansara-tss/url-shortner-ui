<app-navbar></app-navbar>
<div class="home">

    <h1>Shorten your URL</h1>

    <p>
        Make your long URLs short and easy to share.
    </p>

    <div class="shortener">

        <input type="text" placeholder="Enter your long URL" />

        <button class="btn-primary" (click)="shortenUrl()">
            Shorten URL
        </button>

    </div>

    <div class="result">

        <span>Your shortened URL</span>

        <div class="result-box">
            <span class="short-url">
                shortUrl 
            </span>

            <button class="btn-secondary">
                Copy this URL
            </button>
        </div>

    </div>

</div>

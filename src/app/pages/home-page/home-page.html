<app-navbar></app-navbar>
<div class="home">

    <h1>Shorten your URL</h1>

    <p>
        Make your long URLs short and easy to share.
    </p>

    <div class="shortener">
        <form #urlForm="ngForm" (ngSubmit)="shortenUrl(urlForm)" class="url-form">

            <input type="url" name="longUrl" [(ngModel)]="longUrl" #url="ngModel" pattern="https?://.+" placeholder="Enter your long URL" required/>

            @if(url.invalid && url.touched) {
                
                @if(url.errors?.['required']){
                    <small class="error">
                        URL is required.
                    </small>
                }
                @if (url.errors?.['pattern']) {
                    <small class="error">
                        Please enter a valid URL starting with http:// or https://
                    </small>
                }
                
            }

            <button type="submit" [disabled]="urlForm.invalid" class="btn-primary">
                Shorten URL
            </button>
        </form>
    </div>

    <div class="result">

        <span>Your shortened URL</span>

        <div class="result-box">
            <span class="short-url">
                shortUrl 
            </span>

            <button class="btn-secondary">
                Copy this URL
            </button>
        </div>

    </div>

</div>
